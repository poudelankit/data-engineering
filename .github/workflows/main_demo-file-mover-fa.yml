name: Build and Deploy Python Azure Function (Flex Consumption)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: demo-file-mover-FA
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "./azure-function-app"
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/requirements.txt

      # Optional debug step - remove once deployment succeeds
      - name: Verify Function App contents
        run: |
          echo "Repository root:"
          ls -la

          echo ""
          echo "Azure Function App:"
          ls -la ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

          echo ""
          echo "host.json:"
          cat ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/host.json

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1.5.3
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          remote-build: true